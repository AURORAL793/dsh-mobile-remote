<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="局域网文件">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="浏览电脑上的照片、文本和文件">
<title>局域网文件</title>
<link rel="manifest" href="fmanifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 015.5 6h3.2l2 2.4h7.8A2.5 2.5 0 0121 10.9v6.6A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5v-9z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 17l4.5-4.5L13 17l2.5-2.5L20 19"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M6 4h8l4 4v12a1.5 1.5 0 01-1.5 1.5h-10A1.5 1.5 0 015 20V5.5A1.5 1.5 0 016.5 4z"/><path d="M8.5 12h7M8.5 16h5"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6.5l10-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="7" rx="2.2"/><rect x="3" y="13" width="18" height="7" rx="2.2"/><circle cx="17.5" cy="8.5" r="1" fill="currentColor" stroke="none"/><circle cx="17.5" cy="16.5" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.2"/><path d="M9 20h6M12 16v4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M12 15l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z"/><path d="M13 3v5h5M8.5 13h7M8.5 16.5h4.5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5v7a2.5 2.5 0 01-2.5 2.5H10l-4.5 4v-4H6.5A2.5 2.5 0 014 13.5z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.9"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10 6.5-10 6.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v4h-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 19.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M20 20v.01M17 20h6"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnBack" aria-label="返回" hidden>
      <svg class="ic"><use href="#i-back"/></svg>
    </button>
    <div class="titles">
      <div class="title" id="topTitle">局域网文件</div>
      <div class="subtitle" id="topSub">正在连接…</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btnSearch" aria-label="搜索" hidden>
        <svg class="ic"><use href="#i-search"/></svg>
      </button>
      <button class="icon-btn" id="btnSort" aria-label="排序" hidden>
        <svg class="ic"><use href="#i-sort"/></svg>
      </button>
      <button class="icon-btn" id="btnLayout" aria-label="切换视图" hidden>
        <svg class="ic"><use href="#i-grid"/></svg>
      </button>
      <button class="icon-btn" id="btnHome" aria-label="回到首页">
        <svg class="ic"><use href="#i-home"/></svg>
      </button>
    </div>
  </header>

  <div class="crumbs" id="crumbs" hidden></div>

  <div class="searchbar" id="searchbar" hidden>
    <div class="search-inner">
      <svg class="ic search-ic"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="在当前文件夹中搜索…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="link-btn" id="btnSearchCancel">取消</button>
    </div>
  </div>

  <main id="main">
    <section id="locView" class="view"></section>
    <section id="fileView" class="view" hidden>
      <div class="toolbar" id="toolbar"></div>
      <div id="fileList" class="file-list"></div>
      <div id="fileMore" class="more-wrap" hidden><button class="more-btn" id="btnMore">加载更多</button></div>
    </section>
    <section id="resultView" class="view" hidden></section>
  </main>
</div>

<!-- ============ 看图器 ============ -->
<div class="overlay viewer" id="viewer" hidden>
  <div class="v-top">
    <button class="icon-btn on-dark" id="vClose" aria-label="关闭">
      <svg class="ic"><use href="#i-close"/></svg>
    </button>
    <div class="v-titles">
      <div class="v-name" id="vName">图片</div>
      <div class="v-count" id="vCount"></div>
    </div>
    <button class="icon-btn on-dark" id="vInfo" aria-label="信息">
      <svg class="ic"><use href="#i-info"/></svg>
    </button>
  </div>
  <div class="v-stage" id="vStage">
    <div class="v-spinner" id="vSpinner"></div>
    <img id="vImg" alt="" draggable="false">
  </div>
  <div class="v-prev icon-btn on-dark" id="vPrev" aria-label="上一张">
    <svg class="ic"><use href="#i-back"/></svg>
  </div>
  <div class="v-next icon-btn on-dark" id="vNext" aria-label="下一张">
    <svg class="ic"><use href="#i-chevron"/></svg>
  </div>
  <div class="v-bottom">
    <button class="pill" id="vDownload">
      <svg class="ic"><use href="#i-download"/></svg><span>保存</span>
    </button>
    <button class="pill" id="vOriginal">
      <svg class="ic"><use href="#i-image"/></svg><span>原图</span>
    </button>
  </div>
</div>

<!-- ============ 文本阅读器 ============ -->
<div class="overlay reader" id="reader" hidden>
  <div class="r-top">
    <button class="icon-btn" id="rClose" aria-label="关闭">
      <svg class="ic"><use href="#i-back"/></svg>
    </button>
    <div class="r-titles">
      <div class="r-name" id="rName">文本</div>
      <div class="r-meta" id="rMeta"></div>
    </div>
    <div class="r-tools">
      <button class="tool-btn" id="rMinus" aria-label="缩小字号">A−</button>
      <button class="tool-btn" id="rPlus" aria-label="放大字号">A+</button>
    </div>
  </div>
  <div class="r-body" id="rBody"><pre id="rText"></pre></div>
</div>

<!-- ============ 音视频播放器 ============ -->
<div class="overlay player" id="player" hidden>
  <div class="p-top">
    <button class="icon-btn on-dark" id="pClose" aria-label="关闭">
      <svg class="ic"><use href="#i-back"/></svg>
    </button>
    <div class="p-titles">
      <div class="p-name" id="pName"></div>
      <div class="p-meta" id="pMeta"></div>
    </div>
    <button class="icon-btn on-dark" id="pDownload" aria-label="下载">
      <svg class="ic"><use href="#i-download"/></svg>
    </button>
  </div>
  <div class="p-body" id="pBody"></div>
</div>

<!-- ============ 底部面板 ============ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="static/app.js"></script>
</body>
</html>
